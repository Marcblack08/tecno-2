<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TecnoDoc Pro - Crear cuenta</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login-page">
<section class="login-card">
    <div class="brand">
        <div class="brand-icon">TD</div>
        <div><h1>TecnoDoc Pro</h1><p>Gestión empresarial inteligente</p></div>
    </div>
    <div class="login-header">
        <h2>Crear cuenta</h2>
        <p>Crea tu espacio empresarial</p>
    </div>
    <form id="registerForm" novalidate>
        <div class="form-group"><label for="registerName">Nombre</label><input id="registerName" type="text" autocomplete="given-name" required></div>
        <div class="form-group"><label for="registerCompany">Empresa</label><input id="registerCompany" type="text" autocomplete="organization" required></div>
        <div class="form-group"><label for="registerEmail">Correo electrónico</label><input id="registerEmail" type="email" autocomplete="email" placeholder="correo@empresa.com" required></div>
        <div class="form-group"><label for="registerPassword">Contraseña</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="form-group"><label for="registerPassword2">Repetir contraseña</label><input id="registerPassword2" type="password" autocomplete="new-password" minlength="8" required></div>
        <button type="submit" class="btn-primary" id="registerButton">Crear cuenta</button>
    </form>
    <div class="login-footer"><p>¿Ya tienes una cuenta? <a href="index.html">Iniciar sesión</a></p></div>
    <div id="registerMessage" class="login-message" role="alert" aria-live="polite"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
</body>
</html>
