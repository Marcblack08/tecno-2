<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TecnoDoc Pro - Plataforma empresarial para proformas, informes técnicos y gestión documental.">
    <title>TecnoDoc Pro</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <div class="brand-icon">TD</div>
                <div><h1>TecnoDoc Pro</h1><p>Gestión empresarial inteligente</p></div>
            </div>
            <div class="login-header">
                <h2>Iniciar sesión</h2>
                <p>Accede a tu espacio empresarial</p>
            </div>
            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="correo@empresa.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <div class="login-options">
                    <label class="remember"><input type="checkbox" id="remember"><span>Recordarme</span></label>
                    <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-primary" id="loginButton">Iniciar sesión</button>
            </form>
            <div class="login-footer"><p>¿No tienes una cuenta? <a href="registro.html">Crear cuenta</a></p></div>
            <div id="loginMessage" class="login-message" role="alert" aria-live="polite"></div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
